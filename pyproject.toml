[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "limit-experiments"
version = "0.1.0"
description = "Refactored LiMiT experimental suite"
authors = [
    {name = "Researcher", email = "noreply@example.com"}
]
readme = "README.md"
requires-python = ">=3.8"

# -----------------------------------------------------------------------------
# Core runtime dependencies – kept in array form as required
# -----------------------------------------------------------------------------
dependencies = [
    "torch>=1.9.0",
    "torchvision>=0.10.0",
    "transformers>=4.31.0",
    "datasets>=2.14.0",
    "huggingface_hub>=0.17.0",
    "PyYAML>=6.0",
    "matplotlib>=3.5.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "pillow>=8.0.0",
    "tqdm>=4.60.0",
]
