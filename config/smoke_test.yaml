# Small-scale configuration suitable for <30 sec validation on CPU

general:
  device: "cpu"
  seed: 0
  num_workers: 0

dataset:
  hf_repo: "hf-internal-testing/cats_vs_dogs"
  split: "train[:5]"
  resolution: [64]
  max_images: 4

model:
  name: "google/vit-base-patch16-224"
  revision: "main"

experiment_1:
  lambdas: [0.1]
  baselines: ["no_cache"]
  batch_size: 2
