global:
  device: cuda
  dtype: bfloat16
  batch_size: 4
  num_workers: 4
  output_dir: .research/iteration3
  figure_dir: .research/iteration3/images
experiments:
  - name: experiment1_memory_fidelity_pareto
    type: image
    model: facebook/DiT-XL-2-256
    resolutions:
      - 256
      - 512
    prompt_sets:
      - tag: coco
        dataset: ms_coco
        split: validation
        field: caption
        take: 100
      - tag: cifar10
        dataset: cifar10
        split: test
        field: label
        take: 50
    sampler:
      steps: 12
      algorithm: dpm_solver++
    method_variants:
      - name: vanilla
        cache: null
      - name: orchid_hsb
        cache:
          rank_c: 16
          rank_f: 8
          ost_momentum: 0.005
          enable_scp: false
      - name: orchid_full
        cache:
          rank_c: 16
          rank_f: 8
          ost_momentum: 0.005
          enable_scp: true
    metrics:
      - fid
      - latency
      - peak_vram
      - macs
      - energy
    seeds:
      - 0
      - 1
  - name: experiment2_reuse_window_analysis
    type: image
    model: facebook/DiT-XL-2-256
    resolution: 256
    reuse_windows:
      - 5
      - 10
      - 15
      - 20
      - 25
    prompts:
      dataset: ms_coco
      split: validation
      field: caption
      take: 50
    sampler:
      steps: 30
      algorithm: dpm_solver++
    method_variants:
      - name: orchid_linear
        cache:
          rank_c: 16
          rank_f: 8
          enable_scp: false
      - name: orchid_scp_skew
        cache:
          rank_c: 16
          rank_f: 8
          enable_scp: true
      - name: orchid_scp_free
        cache:
          rank_c: 16
          rank_f: 8
          enable_scp: true
          backend: orchid_free
    metrics:
      - fid
      - latency
      - macs
    seeds:
      - 0
      - 1
  - name: experiment3_cross_modal_deployment
    type: multimodal
    models:
      - name: image_dit
        model: facebook/DiT-XL-2-256
        resolution: 256
      - name: audio_mock
        model: mock_audio_diffuser
        sample_rate: 16000
    prompt_sets:
      - tag: image_coco
        dataset: ms_coco
        split: validation
        field: caption
        take: 30
      - tag: audio_mock
        dataset: mock_audio
        split: test
        field: description
        take: 20
    sampler:
      steps: 15
      algorithm: dpm_solver++
    method_variants:
      - name: vanilla
        cache: null
      - name: orchid_cross_modal
        cache:
          rank_c: 12
          rank_f: 6
          ost_momentum: 0.005
          enable_scp: true
          sparse_ratio: 0.2
    metrics:
      - fid
      - latency
      - peak_vram
    seeds:
      - 0
