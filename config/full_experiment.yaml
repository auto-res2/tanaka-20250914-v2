run_name: full_$(date +%Y%m%d_%H%M%S)
seed_list: [111, 222, 333]
results_dir: .research/iteration3
experiments:
  - id: exp1_full_system
    type: full_system
    models:
      - repo: facebook/DiT-XL-2-256
        resolution: 256
      - repo: facebook/DiT-XL-2-512
        resolution: 512
      - repo: openai/uvit-h-2-256
        resolution: 256
      - repo: PixArt-alpha/PixArt-Sigma-S-16x256x256
        resolution: 256
    datasets:
      coco_val:
        url: https://images.cocodataset.org/zips/val2017.zip
        split: val2017
    generation:
      num_images: 500
      num_inference_steps: 50
      guidance_scale: 4.0
    compression_grid:
      - {method: vanilla}
      - {method: l2c}
      - {method: fjlt_fixed, k_factor: 0.125, bits: 8}
      - {method: ta_fjlt, c: 1.0, keyframe_K: 6}
      - {method: ta_fjlt, c: 0.8, keyframe_K: 4}
